<head>
  <meta charset="UTF-8">

  <!-- =========================
       CSS
  ========================== -->
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* Main fullscreen container */
    .video-page {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    /* Background image */
    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Dark overlay */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 2;
    }

    /* Main video */
    .main-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%);
      object-fit: contain;
      z-index: 3;
    }

    /* Top navigation */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 22px 35px;

      color: #fff;
      font-size: 18px;

      z-index: 5;
    }

    .top-bar span {
      padding: 10px 20px;
      border-radius: 25px;
      background: rgba(0, 0, 0, 0.55);
    }

    /* Watch button */
    .watch-button {
      position: absolute;
      top: 50%;
      left: 50%;

      width: 110px;
      height: 110px;

      display: flex;
      align-items: center;
      justify-content: center;

      transform: translate(-50%, -50%);

      border-radius: 50%;
      background: #4fc3f7;

      text-decoration: none;

      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);

      z-index: 6;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .watch-button:hover {
      transform:
        translate(-50%, -50%)
        scale(1.08);

      box-shadow:
        0 6px 30px rgba(0, 0, 0, 0.5);
    }

    /* Play icon */
    .watch-button::after {
      content: "";

      width: 0;
      height: 0;

      margin-left: 8px;

      border-top: 25px solid transparent;
      border-bottom: 25px solid transparent;
      border-left: 36px solid #fff;
    }

    /* Progress bar */
    .progress {
      position: absolute;
      bottom: 0;
      left: 0;

      width: 100%;
      height: 6px;

      background: rgba(255, 255, 255, 0.3);

      z-index: 7;
    }

    .progress-bar {
      width: 38%;
      height: 100%;
      background: #ff0000;
    }

    /* Hide Histats counter */
    #histats_counter {
      position: fixed;
      left: -9999px;
      top: -9999px;

      width: 1px;
      height: 1px;

      opacity: 0;
      pointer-events: none;
      overflow: hidden;
    }

    /* =========================
       MOBILE
    ========================== */
    @media (max-width: 600px) {

      .top-bar {
        padding: 20px 25px;
        font-size: 16px;
      }

      .top-bar span {
        padding: 8px 16px;
      }

      .watch-button {
        width: 90px;
        height: 90px;
      }

      .watch-button::after {
        border-top-width: 20px;
        border-bottom-width: 20px;
        border-left-width: 30px;
      }

      .progress {
        height: 5px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       MAIN PAGE
  ========================== -->
  <main class="video-page">

    <!-- Background -->
    <img
      class="background"
      src="https://cdn.aceimg.com/p4IgCs6de.png"
      alt=""
    >

    <!-- Dark overlay -->
    <div class="overlay"></div>

    <!-- Video -->
    <video
      class="main-video"
      autoplay
      muted
      loop
      playsinline
      poster="https://cdn.aceimg.com/96K0xOmM3.png"
    >
      <source
        src="https://videy.co/MW9fdqOW1.mp4"
        type="video/mp4"
      >

      Your browser does not support HTML5 video.
    </video>

    <!-- Top bar -->
    <div class="top-bar">
      <span>Video</span>
      <span>Watch</span>
    </div>

    <!-- Watch button -->
    <a
      class="watch-button"
      href="https://uplcm.com/4/11065842"
      aria-label="Watch Video"
    ></a>

    <!-- Progress bar -->
    <div class="progress">
      <div class="progress-bar"></div>
    </div>

  </main>

  <!-- =========================

  </noscript>

</body>
</html>
